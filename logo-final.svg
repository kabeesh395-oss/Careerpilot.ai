<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Royal Blue to Sky Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    
    <!-- White to Light Blue Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Square Background with smooth rounded corners -->
  <rect width="400" height="400" rx="80" fill="url(#bgGrad)"/>

  <!-- Abstract Flowing Curves (Centered in Top Half) -->
  <!-- Blue Outer Flow -->
  <path d="M 110 240 C 160 240, 230 180, 280 90" fill="none" stroke="url(#blueGrad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- White Inner Flow -->
  <path d="M 130 250 C 180 230, 240 180, 270 110" fill="none" stroke="url(#whiteGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Light Blue Accent Flow -->
  <path d="M 150 260 C 190 250, 240 210, 260 150" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>

  <!-- Glowing AI Node Star at peak -->
  <circle cx="280" cy="90" r="14" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="280" cy="90" r="6" fill="#3b82f6"/>
  <circle cx="280" cy="90" r="2.5" fill="#ffffff"/>

  <!-- App Name Typography (Robust multi-engine compatible text) -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    <text x="200" y="340">
      <tspan fill="#ffffff">CareerPilot </tspan><tspan fill="#3b82f6">AI</tspan>
    </text>
  </g>
</svg>
