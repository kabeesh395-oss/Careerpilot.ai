workflows:
  android-expo-app:
    name: CareerPilot Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20
    scripts:
      - name: Setup Expo and WebView Dependencies
        script: |
          npx create-expo-app@latest android-wrapper --template blank
          cd android-wrapper
          npx expo install react-native-webview
          
          # Create App.js configured for client-side GitHub Pages / Direct Studio integration
          cat << 'EOF' > App.js
          import React from 'react';
          import { SafeAreaView, StatusBar, StyleSheet } from 'react-native';
          import { WebView } from 'react-native-webview';

          export default function App() {
            return (
              <SafeAreaView style={styles.container}>
                <StatusBar backgroundColor="#020107" barStyle="light-content" />
                <WebView 
                  source={{ uri: 'https://kabeesh395-oss.github.io/Careerpilot.ai/' }} 
                  style={styles.webview}
                  javaScriptEnabled={true}
                  domStorageEnabled={true}
                  allowFileAccess={true}
                  allowUniversalAccessFromFileURLs={true}
                  mixedContentMode="always"
                  startInLoadingState={true}
                  bounces={false}
                  overScrollMode="never"
                />
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: { flex: 1, backgroundColor: '#020107' },
            webview: { flex: 1, backgroundColor: '#020107' },
          });
          EOF

      - name: Generate Android Native Project
        script: |
          cd android-wrapper
          npx expo prebuild --platform android --clean

      - name: Compile Android APK
        script: |
          cd android-wrapper/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

    artifacts:
      - android-wrapper/android/app/build/outputs/apk/release/*.apk
