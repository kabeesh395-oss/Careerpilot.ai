workflows:
  native-android:
    name: CareerPilot AI Native Android Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.careerpilot.ai"
    scripts:
      - name: Build Native Android APK (Gradle)
        script: |
          chmod +x ./gradlew ./android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - app/build/outputs/apk/**/*.apk
