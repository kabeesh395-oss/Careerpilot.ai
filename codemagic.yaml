workflows:
  native-android:
    name: CareerPilot AI Native Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.careerpilot.ai"
    scripts:
      - name: Build Android APK (Gradle)
        script: |
          # Ensure gradlew is executable
          chmod +x ./gradlew
          # Build the debug APK using Gradle
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
